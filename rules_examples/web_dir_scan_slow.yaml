# and how it differs from web_dir_scan.yaml
id: web-dir-scan-slow
name: Possible Slow Directory Scan
description: 20+ HTTP 404 responses from the same source IP within 600 seconds
severity: low
mitre_attack: T1595.003
mitre_tactic: Reconnaissance
cooldown_seconds: 900
detection:
  type: threshold
  match:
    equals:
      source: web_access
      event_type: web_request
      http_status: 404
  group_by: src_ip
  threshold: 20
  window_seconds: 600