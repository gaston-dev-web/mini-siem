# Threshold rule: many failed SSH logins from the same source IP in a short
# window is the textbook signature of a brute-force / credential-stuffing
# attack. This mirrors real Sigma rules like "Multiple Failed Logins".
id: ssh-brute-force
name: SSH Brute Force
description: 5+ failed SSH authentication attempts from the same source IP within 60 seconds
severity: high
cooldown_seconds: 120
detection:
  type: threshold
  match:
    equals:
      source: sshd
      event_type: authentication
      outcome: failure
  group_by: src_ip
  threshold: 5
  window_seconds: 60
