# Threshold rule: a burst of 404s from one source IP is the signature of a
# directory/content scanner (gobuster, dirb, ffuf) probing for hidden paths.
# Legitimate users rarely produce more than a handful of 404s in a minute.
id: web-dir-scan
name: Possible Directory Scan
description:  20+ HTTP 404 responses to the same source IP within 60 seconds
severity: medium
cooldown_seconds: 120
detection:
  type: threshold
  match:
    equals:
      source: web_access
      event_type: web_request
      http_status: 404
  group_by: src_ip
  threshold: 20
  window_seconds: 60